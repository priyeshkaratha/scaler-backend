# Local stack.
#   Database only:   docker compose -f docker/docker-compose.yaml up -d db
#   Database + API:  docker compose -f docker/docker-compose.yaml up -d --build
services:
  db:
    image: mysql:8.0
    container_name: my-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw # local development only
      MYSQL_DATABASE: productcatalog
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmy-secret-pw"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: productcatalog-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/productcatalog
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: my-secret-pw
      ADMIN_EMAIL: admin@productcatalog.local
      ADMIN_PASSWORD: ChangeMe123!
    ports:
      - "8080:8080"

volumes:
  mysql-data:

services:
  db:
    image: mysql:8.0 # Use the official MySQL 8.0 image from Docker Hub
    container_name: my-mysql
    restart: always # Ensures the container restarts automatically if it fails
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw # **Change this to a secure password**
      MYSQL_DATABASE: mydb # Optional: creates a default database on startup
    ports:
      - "3306:3306" # Maps the containers MySQL port to your host machines port
    volumes:
      - mysql-data:/var/lib/mysql # Persists data to a named volume

volumes:
  mysql-data: # Defines the named volume


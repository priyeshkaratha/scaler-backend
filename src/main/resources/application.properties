spring.application.name=productcatalog

# Database: defaults target the local Docker Compose MySQL; override with env vars in other environments
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/productcatalog?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:my-secret-pw}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: use 'validate' in production (SPRING_JPA_HIBERNATE_DDL_AUTO=validate)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Security
jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLWRlbW8tc2VjcmV0LWtleS1jaGFuZ2UtbWUtbm93LTEyMzQ=}
jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:10}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Actuator: only the health endpoint is exposed (used by the load balancer)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
